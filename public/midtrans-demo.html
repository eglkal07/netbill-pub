<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulasi Pembayaran Online – NetBill (demo)</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f1f5f9; color: #0f172a; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 28px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    .tag { display: inline-block; background: #fef3c7; color: #92400e; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
    h1 { font-size: 20px; margin: 12px 0 4px; }
    .amount { font-size: 28px; font-weight: 700; margin: 14px 0; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; color: #475569; }
    dd { margin: 0; color: #0f172a; font-family: ui-monospace, monospace; word-break: break-all; }
    .methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0; }
    .methods button { border: 1px solid #cbd5e1; background: #fff; border-radius: 10px; padding: 10px; cursor: pointer; font: inherit; }
    .methods button:hover { border-color: #0f766e; background: #f0fdfa; }
    .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
    .ok { background: #dcfce7; color: #166534; } .warn { background: #fef3c7; color: #92400e; }
    small { color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">SIMULASI – bukan pembayaran sungguhan</span>
    <h1>Pembayaran Internet</h1>
    <small>Halaman ini meniru halaman pembayaran Midtrans pada versi demo NetBill.</small>
    <div class="amount" id="amount">-</div>
    <dl><dt>No. tagihan</dt><dd id="inv">-</dd><dt>Order ID</dt><dd id="order">-</dd></dl>
    <div id="pay">
      <div class="methods">
        <button data-ch="qris">QRIS</button><button data-ch="gopay">GoPay</button>
        <button data-ch="bca_va">BCA Virtual Account</button><button data-ch="bni_va">BNI Virtual Account</button>
      </div>
    </div>
    <div id="out"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const order = q.get('order');
    document.getElementById('inv').textContent = q.get('invoice') || '-';
    document.getElementById('order').textContent = order || '-';
    document.getElementById('amount').textContent = q.get('amount') ? 'Rp ' + Number(q.get('amount')).toLocaleString('id-ID') : '-';
    const out = document.getElementById('out');
    if (!order) {
      document.getElementById('pay').hidden = true;
      out.innerHTML = '<div class="msg warn">Link ini hanya contoh. Buat link pembayaran dari menu <b>Tagihan › Bayar › Link Midtrans</b> di panel admin demo.</div>';
    }
    const ch = 'BroadcastChannel' in window ? new BroadcastChannel('netbill.midtrans-demo') : null;
    let timer = null;
    ch && (ch.onmessage = (e) => {
      if (e.data && e.data.ack === order) {
        clearTimeout(timer);
        document.getElementById('pay').hidden = true;
        out.innerHTML = '<div class="msg ok">✅ Pembayaran berhasil (simulasi). Tagihan otomatis lunas dan notifikasi muncul di dashboard admin.</div>';
      }
    });
    document.querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => {
      if (!ch) { out.innerHTML = '<div class="msg warn">Peramban ini tidak mendukung simulasi (BroadcastChannel).</div>'; return; }
      out.innerHTML = '<div class="msg">Memproses…</div>';
      ch.postMessage({ order_id: order, channel: b.dataset.ch });
      timer = setTimeout(() => {
        out.innerHTML = '<div class="msg warn">Tidak ada tab panel admin demo yang terbuka, atau tagihan ini sudah lunas/dibatalkan. Buka panel admin di tab lain pada peramban yang sama, lalu coba lagi.</div>';
      }, 2500);
    });
  </script>
</body>
</html>
